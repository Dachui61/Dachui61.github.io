    #   awarder: 某某机构
    #   date: '2024'
    #   url: https://example.com

    # ---------------------------------------------------------------------
    # 认证。和获奖不是一回事——认证有颁发方和（通常有）有效期。
    # TODO：空的。
    # ---------------------------------------------------------------------
    certificates: []
