# ============================================================================
# 简历数据
#
# 这就是「简历」页面的全部内容来源。改完提交 → GitHub Actions 自动重新部署。
# 不用装任何东西，不用注册任何东西。
#
# 约定：
#   - `zh:` 和 `en:` 是同一份简历的两种语言，字段结构完全一致。
#   - 多行文字用 `|` 块标量（下面那一块缩进的内容就是正文）。
#   - 日期用 ISO 8601，允许只写年月：`'2024-03'`。`end` 留空 = 至今。
#   - 「精选项目」和「精选写作」不用在这里写：它们由目录条目的
#     `featured: true` 自动带出来。
#   - `skills[].proof` 填目录里某个条目的 slug，会自动变成一个链接。
#     现有 slug：vitals / radar / temperature-backend-and-degradation /
#     why-no-privileged-component / private-apis-and-degradation /
#     metric-backends / oss-hotlist-aggregation-landscape /
#     data-source-feasibility-and-compliance /
#     diversity-ranking-and-ad-filtering-algorithms /
#     electron-python-sidecar-integration
#
# 这份文件同时会导出一份 JSON Resume v1.9.0 标准的 JSON：
#   https://dachui61.github.io/resume.json
#   https://dachui61.github.io/en/resume.json
# 导出结果在构建时会用官方 schema 校验，校验不过构建会失败。
# ============================================================================

- id: resume
  zh:
    basics:
      name: 刘宇
      # 一句话定位。招聘方扫简历最先看这个。
      label: macOS / 系统层工程
      # 自我介绍。2-3 段。
      summary: |
        我是刘宇，GitHub 上叫 Dachui61。大部分代码在我这台 Mac mini 上跑。

        我写 Swift 和 Electron，做的都是自用工具——不是给别人用的产品，是我自己每天离不开的东西。
        Vitals 是一个常驻菜单栏的 macOS 监控；Radar 是把「今天值得读的」和「附近好玩好吃的」
        两条信息流汇进同一套管道的桌面工具，现在还在设计阶段。

        做决定之前先查证，结论回到一手来源：仓库主页、仓库里的 README 和 LICENSE、官方文档页。
        只到搜索结果页级别的判断我会明确标注，取不到的字段写「未取到」，不猜。
      # 留空就不显示。
      email: ''
      profiles:
        - network: GitHub
          username: Dachui61
          url: https://github.com/Dachui61

    # ---------------------------------------------------------------------
    # 工作经历。按时间倒序。
    # TODO：这一节还是空的。把下面注释掉的示例取消注释，照着格式填自己的。
    # ---------------------------------------------------------------------
    work: []
    # - name: 某某公司
    #   position: 某某工程师
    #   startDate: '2024-03'
    #   endDate: ''          # 留空 = 至今
    #   highlights:
    #     - 做成了什么（成果优先，不是职责罗列）
    #     - 做了什么不一样的事

    # ---------------------------------------------------------------------
    # 教育。
    # TODO：同样是空的。
    # ---------------------------------------------------------------------
    education: []
    # - institution: 某某大学
    #   area: 计算机科学
    #   startDate: '2016'
    #   endDate: '2020'

    # ---------------------------------------------------------------------
    # 技术能力。每项可以挂一条「证据」——指向目录里的某个条目。
    # 「这个技能我能证明」比「我会这个技能」有力得多。
    # ---------------------------------------------------------------------
    skills:
      - name: Swift / SwiftUI
        note: 写了一个常驻菜单栏的 macOS 监控，从采样层到无边框悬浮窗。
        proof: vitals
      - name: macOS 系统层
        note: SMC / IOKit 私有接口的能力探测与自动降级，不引入任何特权组件。
        proof: temperature-backend-and-degradation
      - name: Electron + Python
        note: 桌面壳与 sidecar 的进程边界与 IPC 契约，读源码读出来的，不是照博客抄的。
        proof: electron-python-sidecar-integration
      - name: 技术调研与决策记录
        note: 逐个读到源码级的方案盘点，每条结论回到一手来源。
        proof: oss-hotlist-aggregation-landscape

    # ---------------------------------------------------------------------
    # 获奖。
    # TODO：空的。填的时候有链接就填 url。
    # ---------------------------------------------------------------------
    awards: []
