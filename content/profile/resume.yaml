  en:
    # One line. This is what a recruiter reads first.
    label: macOS / systems engineering

    # Two or three paragraphs.
    summary: |
      I am Yu Liu, known as Dachui61 on GitHub. Most of the code runs on this Mac mini.

      I write Swift and Electron, and everything I build is for my own use — not a product for
      someone else, but something I need every day. Vitals is a menu-bar monitor that lives on
      this machine; Radar is a desktop tool that puts a daily brief and a map of nearby places
      through one shared pipeline, still being designed.

      I verify before deciding, and every conclusion goes back to a primary source: the repository
      page, the README and LICENSE inside it, the official documentation. Judgements that only
      reach search-result level are labelled as such, and fields I could not fetch are written as
      "not fetched" rather than guessed.

    contact:
      email: ''
      links:
